<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Scheda</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<link rel="apple-touch-icon" id="ati" href="">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111214;color:#eee;font:17px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 220px}
.tabs{position:sticky;top:0;background:#111214;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0;z-index:5}
.tabs button{padding:14px 0;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#24262b;color:#aaa}
.tabs button.on{background:#ff6b2c;color:#fff}
h1{font-size:19px;margin:6px 2px 12px}
.card{background:#1b1d21;border-radius:16px;padding:14px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 4px}
.note{color:#9aa;font-size:14px;margin:2px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.meta span{background:#2a2d33;border-radius:8px;padding:4px 9px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px;border-radius:12px;background:#22252a}
.row.done{background:#17361f}
.row .lb{flex:1;font-size:14px;color:#bbb;min-width:0}
.row .lb small{display:block;color:#7c8;font-size:12px}
.chk{width:56px;height:56px;border-radius:14px;border:2px solid #555;background:#111214;color:#fff;font-size:28px;flex:none}
.row.done .chk{background:#2fb344;border-color:#2fb344}
.row input{width:70px;height:56px;border-radius:12px;border:1px solid #444;background:#111214;color:#fff;font-size:20px;text-align:center}
.row input::placeholder{color:#666}
.hold{height:56px;padding:0 14px;border-radius:14px;border:0;background:#ff6b2c;color:#fff;font-weight:700;font-size:16px;flex:none}
.row.done .hold{background:#2fb344}
.new{width:100%;padding:18px;font-size:18px;font-weight:700;border:0;border-radius:14px;background:#7a1f1f;color:#fff}
#timer{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:2px solid #ff6b2c;padding:10px 12px calc(10px + env(safe-area-inset-bottom));text-align:center;display:none;z-index:9}
#timer .lab{color:#aaa;font-size:14px}
#timer .t{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
#timer .b{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
#timer button{height:56px;border:0;border-radius:14px;background:#2a2d33;color:#fff;font-size:18px;font-weight:700}
#timer button.sk{background:#ff6b2c}
body.flash{animation:fl .4s 6}
@keyframes fl{50%{background:#ff6b2c}}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div id="timer">
  <div class="lab" id="tl"></div>
  <div class="t" id="tt">0:00</div>
  <div class="b">
    <button onclick="adj(-15)">−15s</button>
    <button onclick="adj(15)">+15s</button>
    <button id="pb" onclick="pause()">Pausa</button>
    <button class="sk" onclick="stopT(false)">Salta</button>
  </div>
</div>
<script>
// Rest in secondi; lo/hi intervalli -> valore più basso. arms = no rest tra le braccia. hold = plank (secondi).
const E=(n,s,r,g,rest,o={})=>({n,s,r,g,rest,...o});
const DAYS=[
{t:"Petto – Spalle – Bicipiti",e:[
E("Spinte con manubri su panca piana",3,"6+","6-10",120),
E("Spinte con manubri su panca inclinata 70-75° (spalle)",3,"8+","8-12",120),
E("Croci ai cavi",3,"10+","10-15",120),
E("Piegamenti sulle braccia",3,"MAX","",90),
E("Alzate laterali con manubri",3,"12+","12-20",90),
E("Curl con bilanciere",2,"10+","10-15",120),
E("Curl con manubri a martello, alternato, in piedi",2,"10+","10-15",120,{note:"2 secondi di fermo in massimo accorciamento"}),
E("Curl Bayesian",2,"12+","12-20",60,{arms:1,note:"Curl singolo al cavo, schiena contro il pacco pesi. Rest: 1-1,5 min tra le serie"}),
E("Crunch al cavo",3,"12+","12-20",60)]},
{t:"Schiena – Tricipiti",e:[
E("Trazioni presa supina",3,"MAX","",120,{lab:["senza elastico","con elastico","con elastico"]}),
E("Rematore con manubrio singolo",3,"8+","8-12",90,{arms:1,note:"Rest 1,5 min tra le serie"}),
E("Lat machine presa prona",3,"8+","8-12",120),
E("Pulley",2,"8+","10-15",120),
E("Hyperextension",2,"10+","10-15",90),
E("French press con manubri",2,"10+","10-15",90),
E("Push down con barra o triangolo",2,"12+","12-20",90),
E("Push down singolo con maniglia",2,"12+","12-20",30,{arms:1}),
E("Plank",3,"","",0,{hold:60,note:"3 tenute da 1 minuto; se le chiudi, aggiungi 5 kg per volta"})]},
{t:"Gambe + Bicipiti",e:[
E("Squat al multipower oppure Hack squat",2,"8+","8-12",120),
E("Pressa",2,"8+","8-12",120),
E("Affondi bulgari o in camminata",2,"10+","10-15",120),
E("Leg extension",2,"12+","12-20",90),
E("Stacchi rumeni con manubri",3,"8+","8-12",120),
E("Leg curl",3,"10+","10-15",120),
E("Interno coscia",2,"12+","12-20",90),
E("Curl con manubri, non alternato, da seduto",3,"10+","10-15",120),
E("Curl con corda o vulken al cavo",2,"12+","12-20",90)]},
{t:"Petto – Dorso – Spalle – Tricipiti",e:[
E("Spinte con manubri su panca inclinata 30°",3,"6+","6-10",120),
E("Spinte su panca inclinata 45° al multipower",3,"8+","8-12",120),
E("Trazioni presa prona",3,"MAX","",120,{lab:["senza elastico","con elastico","con elastico"]}),
E("Rowing machine singola",3,"8+","8-12",60,{arms:1,note:"Rest 1-1,5 min tra le serie"}),
E("Shoulder press",3,"8+","8-12",120),
E("Alzate laterali singole al cavo",2,"12+","12-20",45,{arms:1,note:"Rest 45-60 s tra le serie"}),
E("Katana extension con vulken",3,"10+","10-15",120),
E("Push down con corda o vulken",2,"12+","12-20",90),
E("Plank",3,"","",0,{hold:90,note:"3 tenute da 1 minuto e mezzo; se le chiudi, aggiungi 5 kg per volta"})]}
];
const $=s=>document.querySelector(s);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let D=JSON.parse(localStorage.getItem("scheda")||'{"cur":{},"last":{},"day":0}');
const save=()=>localStorage.setItem("scheda",JSON.stringify(D));

function render(){
  $("#tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i==D.day?'on':''}" onclick="D.day=${i};save();render()">Giorno ${i+1}</button>`).join("");
  let h=`<h1>Giorno ${D.day+1}: ${DAYS[D.day].t}</h1>`;
  DAYS[D.day].e.forEach((x,ei)=>{
    h+=`<div class="card"><h2>${ei+1}. ${x.n}</h2>${x.note?`<div class="note">${x.note}</div>`:""}
    <div class="meta"><span>${x.s}×${x.hold?fmt(x.hold):x.r}</span>${x.g?`<span>Range ${x.g}</span>`:""}${x.arms?`<span>No rest tra le braccia</span>`:""}${x.hold?"":`<span>Rec. ${fmt(x.rest)}</span>`}</div>`;
    for(let s=0;s<x.s;s++)for(const a of x.arms?["SX","DX"]:[""]){
      const k=`${D.day}.${ei}.${s}.${a}`,c=D.cur[k]||{},l=D.last[k];
      const lb=`Serie ${s+1}${a?" · "+a:""}${x.lab?`<small>${x.lab[s]}</small>`:""}${l?`<small>ultima: ${l.kg||"–"} kg × ${x.hold?"":(l.reps||"–")}</small>`:""}`;
      h+=`<div class="row ${c.done?"done":""}" data-k="${k}"><div class="lb">${lb}</div>
      <input inputmode="decimal" placeholder="${l?.kg||"kg"}" value="${c.kg||""}" oninput="inp('${k}','kg',this.value)">
      ${x.hold?`<button class="hold" onclick="hold('${k}',${x.hold},'${x.n}')">▶ ${fmt(x.hold)}</button>`
        :`<input inputmode="numeric" placeholder="${l?.reps||"rip"}" value="${c.reps||""}" oninput="inp('${k}','reps',this.value)">
      <button class="chk" onclick="chk('${k}',${ei})">✓</button>`}</div>`;
    }
    h+=`</div>`;
  });
  h+=`<button class="new" onclick="newW()">Nuovo allenamento</button>`;
  $("#main").innerHTML=h;
}
function inp(k,f,v){(D.cur[k]??={})[f]=v;save()}
function setDone(k,v){(D.cur[k]??={}).done=v;save();const r=document.querySelector(`[data-k="${k}"]`);r&&r.classList.toggle("done",v)}
function chk(k,ei){
  wake();audio();
  const c=D.cur[k]||{},v=!c.done;setDone(k,v);
  if(!v)return;
  const x=DAYS[D.day].e[ei],[d,e,s]=k.split(".");
  const both=!x.arms||["SX","DX"].every(a=>D.cur[`${d}.${e}.${s}.${a}`]?.done);
  if(both)startT(x.rest,"Recupero · "+x.n);
}
function hold(k,sec,n){wake();audio();startT(sec,"Tenuta · "+n,()=>setDone(k,true))}
function newW(){
  if(!confirm("Azzerare le spunte? I pesi di oggi diventano \"ultima volta\"."))return;
  for(const k in D.cur){const c=D.cur[k];if(c.kg||c.reps)D.last[k]={kg:c.kg,reps:c.reps}}
  D.cur={};save();stopT(false);render();
}

// Timer basato su timestamp, resta preciso anche se iOS rallenta la pagina
let T=null,iv;
function startT(sec,label,onEnd){
  stopT(false);
  T={end:Date.now()+sec*1000,label,onEnd,paused:false};
  $("#tl").textContent=label;$("#timer").style.display="block";$("#pb").textContent="Pausa";
  iv=setInterval(tick,200);tick();
}
function left(){return T.paused?T.ms:T.end-Date.now()}
function tick(){
  if(!T)return;
  const l=left();$("#tt").textContent=fmt(Math.max(0,Math.ceil(l/1000)));
  if(l<=0){const f=T.onEnd;stopT(false);alarm();f&&f()}
}
function adj(d){if(!T)return;T.paused?T.ms=Math.max(0,T.ms+d*1000):T.end+=d*1000;tick()}
function pause(){
  if(!T)return;
  if(T.paused){T.end=Date.now()+T.ms;T.paused=false;$("#pb").textContent="Pausa"}
  else{T.ms=T.end-Date.now();T.paused=true;$("#pb").textContent="Riprendi"}
}
function stopT(){clearInterval(iv);T=null;$("#timer").style.display="none"}

let ctx;
function audio(){try{ctx??=new(window.AudioContext||webkitAudioContext)();ctx.resume()}catch(e){}}
function alarm(){
  if(ctx)[0,.3,.6].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.4,ctx.currentTime+t);g.gain.setValueAtTime(0,ctx.currentTime+t+.2);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.25)});
  navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);
  document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash");
}

// Wake Lock: va richiesto dopo un tocco e ripreso quando si torna sulla pagina
let wl;
async function wake(){try{if(!wl||wl.released)wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>document.visibilityState=="visible"&&wake());
document.addEventListener("click",wake,{once:true});

// Icona e manifest generati a runtime per restare in un solo file
(()=>{
  const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");
  g.fillStyle="#000";g.fillRect(0,0,180,180);g.fillStyle="#fff";
  g.translate(90,90);g.rotate(Math.PI/4); // 45° verso il basso a destra
  [[-50,-4,100,8],[-62,-26,16,52],[46,-26,16,52],[-76,-16,14,32],[62,-16,14,32]].forEach(r=>g.fillRect(...r)); // barra, dischi grandi, dischi piccoli
  const ic=c.toDataURL();$("#ati").href=ic;
  const m={name:"Scheda Palestra",short_name:"Scheda",display:"standalone",background_color:"#111214",theme_color:"#111214",start_url:location.href,icons:[{src:ic,sizes:"180x180",type:"image/png"}]};
  const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));document.head.append(l);
})();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
